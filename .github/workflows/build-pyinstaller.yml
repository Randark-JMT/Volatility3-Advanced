name: build-pyinstaller
on:
  push:
    branches:
      - stable
      - develop
      - "release/**"
  pull_request:
    branches:
      - stable
      - "release/**"
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  exe:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .[full,cloud]
          pip install pypykatz

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Apply pypykatz patch
        run: |
          $sitePackagesPath = python -c "import site, os; print(site.getsitepackages()[0].replace(os.sep, '/'))"
          $sitePackagesPath = Join-Path $sitePackagesPath "Lib/site-packages"
          git apply --directory="$sitePackagesPath" patch/pypykatz-177.patch

      - name: Pyinstall executable
        run: |
          pyinstaller --clean -y vol.spec
          pyinstaller --clean -y volshell.spec

      - name: Move files
        run: |
          mv dist/vol.exe vol.exe
          mv dist/volshell.exe volshell.exe

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: volatility3-pyinstaller
          path: |
            vol.exe
            volshell.exe
            README.md
            LICENSE.txt
